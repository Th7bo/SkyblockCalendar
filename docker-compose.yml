services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sbcal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: sbcal
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbcal"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Serves the web app, the API and the calendar feeds. In Dokploy, point the domain at this service, port 3000.
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sbcal:${POSTGRES_PASSWORD}@db:5432/sbcal
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN, e.g. https://skyblockcal.example.com}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
